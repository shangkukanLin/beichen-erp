server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# 文件上传路径（相对于工作目录），在 Windows 上会自动解析为绝对路径
# P0：生产请用绝对路径（UPLOAD_PATH=/data/beichen/uploads）并纳入备份，见《上线运维手册》§3.1
file:
  upload:
    path: ${UPLOAD_PATH:./uploads}

spring:
  application:
    name: beichen-erp-server
  # 导入导出闭环：全量导出 JSON 随数据增长很快超过默认 1MB，此前导入直接 500（Maximum upload size exceeded）
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:200MB}
      max-request-size: ${UPLOAD_MAX_FILE_SIZE:200MB}
  datasource:
    # P0：所有敏感项均可由环境变量覆盖；生产请务必改掉 root/root 默认值
    url: ${DB_URL:jdbc:mysql://localhost:3306/beichen_erp?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      auto-commit: true
      read-only: false
  sql:
    init:
      # 表结构**不再**由 Spring 执行 schema.sql —— 统一交给 Flyway（见 docs/数据库演化约定.md）：
      # 脚本已迁到 classpath:db/migration/V1__base.sql。
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 存量库（未上线的开发/测试库已有表）先基线到 0，再把 V1__base.sql 幂等应用一次；全新空库直接执行 V1。
    # ⚠️ 未上线期直接改 V1（基线脚本）即可，但改完**必须重建库** —— 否则 Flyway 会报校验和不匹配。
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: pre-flyway-baseline
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

sa-token:
  token-name: ${SA_TOKEN_NAME:Authorization}
  timeout: ${SA_TOKEN_TIMEOUT:86400}
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

springdoc:
  swagger-ui:
    path: /doc.html

# 应用级可配置项（P0 配置外置，详见《上线运维手册》§3）
app:
  # 跨域白名单（逗号分隔）。默认 * 仅限开发；生产必须显式配置域名，如 https://erp.example.com
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  # 初始口令：仅用于"首次创建"平台超管/公司管理员；生产必须由 INIT_ADMIN_PASSWORD 注入
  init:
    admin-password: ${INIT_ADMIN_PASSWORD:123}
  # 定时任务总开关；多实例部署时建议只在一个实例打开（任务内部另有 MySQL 命名锁兜底）
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}
  # 接口级权限（F3-3 / F7-106 第二步）：**未登记收口前缀**时的默认策略。
  #   true （默认，推荐）：拒绝 —— 白名单式收口的安全兜底，防"新增控制器忘登记即裸奔"（见 F7-105）；
  #   false：放行 —— 应急回滚开关（等价于 2026-09-20 之前的旧行为）。
  # 启动期 ApiPermGuardSelfCheck 会枚举全部 /api 端点核对是否已登记（未登记打 ERROR 日志）。
  perm:
    default-deny: ${PERM_DEFAULT_DENY:true}

logging:
  level:
    com.beichen.erp: ${LOG_LEVEL:debug}
  # P0：日志落盘 + 轮转（此前仅控制台 → 审计/告警日志不可追溯）
  file:
    name: ${LOG_FILE:./logs/beichen-erp.log}
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 2GB
